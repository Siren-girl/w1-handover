[project]
name = "episode-tools"
version = "0.1.0"
description = "W1 练习：episode 数据的校验与统计工具"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",      # ★ CI 里 pytest --cov 靠它，不加会报 unrecognized arguments
    "mypy>=1.11",           # ★ CI 里 uv run mypy src 靠它，不加会 command not found
    "ruff>=0.17",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/episode_tools"]       # ★ src layout 必须显式告诉构建后端包在哪

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"