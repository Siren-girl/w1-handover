[project]
name = "episode-tools"
version = "0.1.0"
description = "W1 练习：episode 数据的校验与统计工具"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",      # ★ CI 里 pytest --cov 靠它，不加会报 unrecognized arguments
    "mypy>=1.11",           # ★ CI 里 uv run mypy src 靠它，不加会 command not found
    "ruff>=0.17",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/episode_tools"]       # ★ src layout 必须显式告诉构建后端包在哪

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# ★ RUF 里有三条「Unicode 同形字」规则：RUF001（字符串）/ RUF002（docstring）/ RUF003（注释）。
#   它们会把中文标点 ，（）：；？！ 判成「和 ASCII 逗号括号长得像的危险字符」而报错。
#   本教程所有代码的注释和 docstring 都是中文，不配这句第一次跑 pre-commit 必挂（见 §5.6 末尾）。
#   用 allowed-confusables 精确放行，而不是 ignore 掉整条规则——后者连真正危险的
#   西里尔字母 а（U+0430，冒充拉丁 a）也一起放过了。
allowed-confusables = [
    "，", "、", "。", "；", "：", "？", "！", "（", "）",
    "“", "”", "‘", "’", "「", "」", "《", "》",
    "×", "·", "…", "★", "§", "→",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
